name: Scheduled posts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Generate due posts and send approval emails
        run: curl --fail-with-body --silent --show-error --max-time 240 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://linkdein-automation-backend.vercel.app/api/cron/scheduled-posts
